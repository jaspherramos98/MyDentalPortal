<!DOCTYPE html>
<!-- Served by the service worker when a navigation fails offline. Must be
     fully self-contained (no network/CDN/PHI) since it loads with no connection. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Offline — Dental Portal</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center;
               justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
               background: #f8f9fa; color: #212529; }
        .card { text-align: center; padding: 2rem; max-width: 420px; }
        .badge { width: 72px; height: 72px; border-radius: 18px; background: #0d6efd;
                 color: #fff; display: inline-flex; align-items: center; justify-content: center;
                 font-size: 36px; margin-bottom: 1rem; }
        h1 { font-size: 1.4rem; margin: 0.5rem 0; }
        p { color: #6c757d; line-height: 1.5; }
        button { margin-top: 1rem; padding: 0.6rem 1.4rem; border: 0; border-radius: 8px;
                 background: #0d6efd; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🦷</div>
        <h1>You're offline</h1>
        <p>MyDentalPortal needs a connection to load patient data — it's an
           online-first app, so live records are never stored on this device.
           Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
