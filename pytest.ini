[pytest]
testpaths = tests
python_files = test_*.py
# Put the project root on sys.path so top-level modules (extensions, config,
# blueprints) import under a bare `pytest` invocation too — not only under
# `python -m pytest` (which adds the CWD itself). Without this, CI's `pytest`
# failed with: ModuleNotFoundError: No module named 'extensions'.
pythonpath = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:mongomock.__version__
    ignore::DeprecationWarning:pkg_resources
